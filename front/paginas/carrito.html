<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda Online</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- Bootstrap Icons (para los botones de eliminar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- CSS personalizado (ruta relativa) -->
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/paginas/dashboard.html">Tienda Online</a>
        <a href="/paginas/dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <button class="btn btn-light" id="logoutBtn">Cerrar Sesión</button>
    </div>
</nav>

<div class="container mt-4">
    
    <div class="row">
        <!-- Columna de Items del Carrito -->
        <div class="col-md-8">
            <h2 class="mb-4">Tu Carrito de Compras</h2>
            
            <!-- Estado de Carga -->
            <div id="loading-spinner" class="text-center" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>

            <!-- Contenedor de los items -->
            <div id="cart-items-container">
                <!-- Los productos del carrito se cargarán aquí -->
                <!-- Ejemplo de un item (se generará por JS):
                <div class="card mb-3 shadow-sm border-0">
                    <div class="row g-0">
                        <div class="col-md-2">
                            <img src="https://placehold.co/600x400" class="img-fluid rounded-start" alt="Producto">
                        </div>
                        <div class="col-md-7">
                            <div class="card-body">
                                <h5 class="card-title">Nombre Producto</h5>
                                <p class="card-text text-muted">Precio: $150</p>
                            </div>
                        </div>
                        <div class="col-md-3 d-flex align-items-center justify-content-center">
                            <button class="btn btn-outline-secondary btn-sm" onclick="disminuirCantidad(1)">-</button>
                            <span class="mx-2">1</span>
                            <button class="btn btn-outline-secondary btn-sm" onclick="agregarAlCarrito(1)">+</button>
                            <button class="btn btn-danger btn-sm ms-3" onclick="removerDelCarrito(1)"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                </div>
                -->
            </div>
            
        </div>

        <!-- Columna del Resumen del Pedido -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 position-sticky" style="top: 20px;">
                <div class="card-body">
                    <h4 class="card-title">Resumen del Pedido</h4>
                    
                    <div id="cart-total-container">
                        <!-- El total se calculará aquí -->
                        <div class="d-flex justify-content-between my-3">
                            <span class="text-muted">Subtotal</span>
                            <strong>$0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between my-3">
                            <span class="text-muted">Envío</span>
                            <strong>GRATIS</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between my-3">
                            <h4>Total</h4>
                            <h4><strong>$0.00</strong></h4>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100" id="checkout-btn">
                        Realizar Pedido
                    </button>
                    
                    <div id="checkout-message" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>
    </div>
    
</div>


<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script de la aplicación (ruta relativa) -->
<script type="module" src="../js/carrito.js"></script>
