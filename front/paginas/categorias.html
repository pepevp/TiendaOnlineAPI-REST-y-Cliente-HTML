<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoría - Tienda Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/paginas/dashboard.html">Tienda Online</a>
        <a href="/paginas/dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        
        <a href="/paginas/carrito.html" class="btn btn-outline-light position-relative me-2" id="cart-button-nav">
            <i class="bi bi-cart"></i> Carrito
            <span id="cart-count-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                0
            </span>
        </a>

        <button class="btn btn-light" id="logoutBtn">Cerrar Sesión</button>
    </div>
</nav>

<div class="container mt-4">
    
    <h2 class="mb-4" id="category-title">Cargando productos...</h2>
    
    <div class="row" id="category-product-list">
        
        <div class="col-12 text-center" id="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2">Buscando productos en esta categoría...</p>
        </div>

    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/categorias.js"></script>
</body>
</html>
